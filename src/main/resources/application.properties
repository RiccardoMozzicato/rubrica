spring.application.name=Rubrica

# Context path allineato al nome del WAR (Rubrica.war -> /Rubrica) anche in esecuzione embedded
server.servlet.context-path=/Rubrica

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Parametri di connessione richiesti dalla consegna; sovrascrivibili via variabili d'ambiente
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rubrica}
spring.datasource.username=${DB_USERNAME:rubrica}
spring.datasource.password=${DB_PASSWORD:rubrica}
